<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidatura · Horma</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f6f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/estilo.css">
  <script src="/static/tema.js"></script>
</head>
<body>
  <header id="cabecera" class="cabecera">
    <a class="marca" href="/">Horma</a>
    <nav id="pestanas" class="pestanas" aria-label="Principal"></nav>
    <div id="derecha" class="derecha"></div>
  </header>
  <main class="ancho">
    <h1 class="titulo-pantalla">Candidatura</h1>

    <p hidden data-explicacion="candidatura" data-explicacion-en="h1"></p>
    <p class="etiqueta-mono"><a href="/candidaturas">← Todas las candidaturas</a></p>
    <span id="aviso" role="status"></span>
    <div id="candidatura"></div>
  </main>

  <!-- RF-10.17: al marcar «Me han contratado» -->
  <dialog id="ventana-contratada" class="ventana" aria-labelledby="contratada-titulo">
    <header>
      <h3 id="contratada-titulo" class="titulo-oferta">¡Enhorabuena!</h3>
      <button id="contratada-cerrar" class="secundario" type="button">Cerrar</button>
    </header>
    <div class="ventana-cuerpo">
      <p id="contratada-texto"></p>
    </div>
  </dialog>
  <script src="/static/textos.js"></script>
  <script src="/static/comun.js"></script>
  <script src="/static/candidatura.js"></script>
  <script src="/static/pwa.js"></script>
</body>
</html>
