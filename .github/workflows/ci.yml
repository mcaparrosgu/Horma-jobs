name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      con_modelo_real:
        description: "Medir con el modelo real (evals-reales). GASTA saldo de Anthropic (~2 USD). Sin marcar, solo corren secretos y calidad."
        type: boolean
        default: false

# Un push nuevo cancela la ejecución anterior del mismo PR o rama: sin evals duplicados (cuestan dinero).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  calidad:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Estilo (ruff)
        run: uv run ruff check .
      - name: Arquitectura (RT-02, RT-13)
        run: uv run lint-imports
      - name: Postgres de pruebas
        run: |
          {
            echo "POSTGRES_USER=horma"
            echo "POSTGRES_DB=horma"
            echo "POSTGRES_PORT=5434"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 12)"
            echo "HORMA_MIGRADOR_PASSWORD=$(openssl rand -hex 12)"
            echo "HORMA_APP_PASSWORD=$(openssl rand -hex 12)"
          } > .env
          . ./.env
          {
            echo "DATABASE_URL=postgresql+psycopg://horma_app:${HORMA_APP_PASSWORD}@127.0.0.1:5434/horma"
            echo "DATABASE_URL_MIGRACIONES=postgresql+psycopg://horma_migrador:${HORMA_MIGRADOR_PASSWORD}@127.0.0.1:5434/horma"
          } >> .env
          docker compose up -d --wait postgres
      - name: Tests (incluye RLS, cola y camino completo)
        run: uv run pytest -q
      - name: Evals en simulado (prueban el harness y los umbrales de evals/umbrales.json; NO miden el modelo)
        run: |
          for set in ofertas fuentes perfil recomendacion red-teaming; do
            uv run horma eval correr "$set" --simulado
          done
          # `puestos` repite lo que contestó el modelo real: mide la puerta de hoy sin gasto (D-064).
          uv run horma eval correr puestos --grabadas --veces 3
          # Lo mismo con `sinonimos-puestos` (spec 012, T31).
          uv run horma eval correr sinonimos-puestos --grabadas
          uv run horma eval correr cv --simulado --flujo plain
          uv run horma eval correr cv --simulado --flujo langgraph
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ejecuciones-de-evals-simulado
          path: evals/resultados/
          if-no-files-found: ignore

  # Mide el modelo de verdad (RF-4.4c). APARCADO hasta el lanzamiento (RF-5.8 de la fase 5): solo a mano
  # (Actions > CI > Run workflow) y marcando la casilla `con_modelo_real`; sin marcarla no gasta. No corre
  # en push ni en PR, así que no puede ser un check obligatorio de `main`. Reactivar antes de lanzar
  # (ver docs/mejoras-futuras.md).
  # No pasa a simulado si falta la clave.
  evals-reales:
    if: github.event_name == 'workflow_dispatch' && inputs.con_modelo_real
    runs-on: ubuntu-latest
    env:
      CI: "true"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HORMA_FLOW_IMPL: langgraph
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ¿El PR toca algo que afecta al modelo?
        id: cambios
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "relevante=true" >> "$GITHUB_OUTPUT"
            echo "Ejecución manual: se mide con el modelo."
            exit 0
          fi
          cambiados=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Archivos cambiados:"; echo "$cambiados"
          if echo "$cambiados" | grep -Eq '^(horma/|evals/|config/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'; then
            echo "relevante=true" >> "$GITHUB_OUTPUT"
            echo "Hay cambios que afectan al modelo: se mide."
          else
            echo "relevante=false" >> "$GITHUB_OUTPUT"
            echo "Solo specs, docs o tests: no se llama al modelo."
          fi
      - name: Comprobar la clave (sin imprimirla)
        if: steps.cambios.outputs.relevante == 'true'
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Falta el secreto ANTHROPIC_API_KEY: las evals reales no pueden pasar a simulado."
            exit 1
          fi
      - if: steps.cambios.outputs.relevante == 'true'
        uses: astral-sh/setup-uv@v5
      - if: steps.cambios.outputs.relevante == 'true'
        run: uv sync
      # `recomendacion` queda fuera hasta el plan del matcher: con el modelo real la nota falla (0,67-0,71 frente a 0,9). Sigue en `calidad`, simulado.
      - name: Evals con el modelo real (tope de 1 USD por set)
        if: steps.cambios.outputs.relevante == 'true'
        run: |
          for set in ofertas fuentes perfil red-teaming; do
            uv run horma eval correr "$set" --tope-coste 1.0
          done
          uv run horma eval correr cv --tope-coste 1.0 --flujo langgraph
      - uses: actions/upload-artifact@v4
        if: always() && steps.cambios.outputs.relevante == 'true'
        with:
          name: ejecuciones-de-evals-reales
          path: evals/resultados/
          if-no-files-found: ignore
