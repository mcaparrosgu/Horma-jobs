[alembic]
script_location = horma/web/migrations
# La URL llega de DATABASE_URL_MIGRACIONES (rol horma_migrador) o de los tests.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
