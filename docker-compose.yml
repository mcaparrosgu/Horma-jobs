name: horma-jobs

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HORMA_APP_PASSWORD: ${HORMA_APP_PASSWORD}
      HORMA_MIGRADOR_PASSWORD: ${HORMA_MIGRADOR_PASSWORD}
    volumes:
      - horma_pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      # Solo en local; en despliegue el puerto no se publica (fase 4).
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: uvicorn horma.web.main:crear_app --factory --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://horma_app:${HORMA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -m horma.web.queue.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://horma_app:${HORMA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  horma_pgdata:
